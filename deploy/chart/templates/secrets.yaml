{{- $s := .Values.secrets }}
{{- if not (and $s.roleArn $s.region $s.app $s.db $s.migrator) }}
{{- fail "secrets.roleArn, region, app, db and migrator are required" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  labels: {{- include "realworld.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # before the ExternalSecrets (wave -1) that authenticate as it
    eks.amazonaws.com/role-arn: {{ $s.roleArn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
  labels: {{- include "realworld.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $s.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
---
# Values in backtick strings are External Secrets templates, emitted literally by Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realworld-api
  labels: {{- include "realworld.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef: { kind: SecretStore, name: aws }
  target:
    name: realworld-api
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ printf "postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:{{ .db_port }}/{{ .db_dbname }}?%s&connection_limit=%d" (include "realworld.dbTls" .) (int .Values.dbConnectionLimit) | quote }}
        REDIS_URL: {{ `"rediss://:{{ .app_REDIS_AUTH_TOKEN }}@{{ .app_REDIS_HOST }}:{{ .app_REDIS_PORT }}"` }}
        JWT_SECRET: {{ `"{{ .app_JWT_SECRET }}"` }}
  dataFrom:
    - extract: { key: {{ $s.db }} }
      rewrite: [{ regexp: { source: "^(.*)$", target: "db_$1" } }]
    - extract: { key: {{ $s.app }} }
      rewrite: [{ regexp: { source: "^(.*)$", target: "app_$1" } }]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realworld-migrate
  labels: {{- include "realworld.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef: { kind: SecretStore, name: aws }
  target:
    name: realworld-migrate
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ printf "postgresql://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:{{ .db_port }}/{{ .db_dbname }}?%s&connection_limit=1" (include "realworld.dbTls" .) | quote }}
  dataFrom:
    - extract: { key: {{ $s.migrator }} }
      rewrite: [{ regexp: { source: "^(.*)$", target: "db_$1" } }]
