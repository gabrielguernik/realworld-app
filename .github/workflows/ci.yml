# CI for the RealWorld API.
#
#   pull_request -> lint + unit tests, hadolint, Helm chart lint, image build, RealWorld API spec (Newman) against
#                   docker compose, Trivy image scan
#   push to main -> the same, then publish: push realworld-api:<sha> and realworld-api:migrate-<sha> to ECR
#                   via GitHub OIDC (role ci/ci-build, no stored AWS keys), and attach a CycloneDX SBOM;
#                   then deploy-sandbox: set revision=<sha> in the gitops repo's sandbox config, which ArgoCD
#                   deploys (chart at this commit + these images).
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: realworld-api
  CI_ROLE_ARN: arn:aws:iam::965140467182:role/ci/ci-build

jobs:
  lint-test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx nx lint api --skip-nx-cache
      - run: npx nx test api --skip-nx-cache

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  chart:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # helm and yq are preinstalled on GitHub-hosted runners.
      - name: Lint and render with sample values
        run: |
          helm lint deploy/chart -f deploy/ci-values.yaml
          helm template realworld deploy/chart -n realworld -f deploy/ci-values.yaml > /dev/null

  api-spec:
    name: image build, API spec and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack (postgres, valkey, migrations, api)
        run: docker compose up -d --build --wait api

      - name: RealWorld API spec (Newman)
        run: tests/api/run-api-tests.sh --reporters cli

      # Local compose talks to PostgreSQL without TLS, so check the RDS root CA separately,
      # as the image's non-root user (the distroless entrypoint is node).
      - name: RDS root CA readable by the runtime user
        run: |
          docker run --rm realworld-api:local -e \
            "const pem = require('fs').readFileSync('/app/certs/rds-ca.pem', 'utf8'); \
             if (!pem.includes('BEGIN CERTIFICATE')) process.exit(1); console.log('RDS root CA OK')"

      - name: API logs
        if: failure()
        run: docker compose logs --no-color

      - name: Trivy scan, runtime image (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: realworld-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan, migrate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: realworld-api:migrate-local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: always()
        run: docker compose down -v

  publish:
    name: publish to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-test, hadolint, chart, api-spec]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> ci/ci-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR: a re-run after a partial publish skips the images already pushed.
      - id: exists
        name: Images already in ECR
        env:
          SHA: ${{ github.sha }}
        run: |
          check() {
            if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$2" >/dev/null 2>&1; then
              echo "$1=true" >>"$GITHUB_OUTPUT"; echo "$2 already pushed"
            fi
          }
          check runtime "$SHA"
          check migrate "migrate-$SHA"

      - name: Push runtime image
        if: steps.exists.outputs.runtime != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push migrate image
        if: steps.exists.outputs.migrate != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`"
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Continuous deployment to the sandbox: commit the new revision to the gitops repo. The deploy key can write
  # to gitops only, and lives in the "sandbox" environment, which only main can use (PR workflows can't read it).
  # Prod would open a PR to its own config file instead of pushing.
  deploy-sandbox:
    name: deploy to sandbox (gitops bump)
    needs: [publish]
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    env:
      CONFIG: clusters/sandbox-us-east-1/apps/config/realworld.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gabrielguernik/gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set revision and push
        env:
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          yq -i '.revision = strenv(SHA)' "$CONFIG"
          if git diff --quiet; then echo "already at $SHA"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "realworld: deploy ${SHA::7} to sandbox-us-east-1" -m "Source: $SOURCE"
          # Another push can land between checkout and push; rebase and retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
