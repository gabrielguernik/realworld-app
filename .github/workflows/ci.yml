# CI for the RealWorld API.
#
#   pull_request -> lint + unit tests, hadolint, image build, RealWorld API spec (Newman) against docker compose,
#                   Trivy image scan
#   push to main -> the same, then publish: push realworld-api:<sha> and realworld-api:migrate-<sha> to ECR
#                   via GitHub OIDC (role ci/ci-build, no stored AWS keys), and attach a CycloneDX SBOM.
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: realworld-api
  CI_ROLE_ARN: arn:aws:iam::965140467182:role/ci/ci-build

jobs:
  lint-test:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx nx lint api --skip-nx-cache
      - run: npx nx test api --skip-nx-cache

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  api-spec:
    name: image build, API spec and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack (postgres, valkey, migrations, api)
        run: docker compose up -d --build --wait api

      - name: RealWorld API spec (Newman)
        run: tests/api/run-api-tests.sh --reporters cli

      # Local compose talks to PostgreSQL without TLS, so check the RDS root CA separately,
      # as the image's non-root user (the distroless entrypoint is node).
      - name: RDS root CA readable by the runtime user
        run: |
          docker run --rm realworld-api:local -e \
            "const pem = require('fs').readFileSync('/app/certs/rds-ca.pem', 'utf8'); \
             if (!pem.includes('BEGIN CERTIFICATE')) process.exit(1); console.log('RDS root CA OK')"

      - name: API logs
        if: failure()
        run: docker compose logs --no-color

      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: realworld-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: always()
        run: docker compose down -v

  publish:
    name: publish to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-test, hadolint, api-spec]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> ci/ci-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha

      - name: Push migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ github.sha }}
          cache-from: type=gha

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json

      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`"
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:migrate-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
